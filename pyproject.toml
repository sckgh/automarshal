[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automarshal"
version = "0.1.0"
description = "Automated Race Track Marshalling & Communication System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioredis>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "asyncio-mqtt>=0.16",
    "aiomqtt>=1.2",
    "edge-tts>=6.1",
    "speechrecognition>=3.10",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.1",
]

[project.scripts]
automarshal = "automarshal.main:entrypoint"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
